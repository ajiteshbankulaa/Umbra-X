server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /healthz-static {
    access_log off;
    return 200 "ok\n";
  }

  # Content-addressed NASA ephemeris & horizon binaries (immutable 1-year cache)
  location ~* ^/data/planner-release/planner/[a-f0-9]{64}\.bin$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Release manifests revalidated on every load so rollbacks propagate cleanly
  location ~* \.json$ {
    add_header Cache-Control "public, max-age=60, must-revalidate";
    try_files $uri =404;
  }

  location ~* \.wasm$ {
    types { application/wasm wasm; }
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Optional backend proxy (frontend remains functional if upstream 502/504)
  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
